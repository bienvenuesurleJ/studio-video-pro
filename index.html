<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Studio vidéo pub – Plug 2 France</title>
<style>
:root {
  --bg: #070b16;
  --card: #121a33;
  --card2: #0c1428;
  --line: rgba(255, 255, 255, .12);
  --txt: #f4f7ff;
  --mut: #9aa6c8;
  --bleu: #2a6bff;
  --or: #f5b800;
  --rouge: #e8202c;
  --ok: #3dd68c;
  --tap: 44px;
  --preview-h: min(42vh, 440px);
  --font: "Segoe UI", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
html, body { max-width: 100%; overflow-x: hidden; }
body {
  background:
    radial-gradient(80% 42% at 100% -8%, rgba(42, 107, 255, .22), transparent 52%),
    radial-gradient(60% 36% at 0% 0%, rgba(245, 184, 0, .1), transparent 48%),
    var(--bg);
  color: var(--txt);
  font-family: var(--font);
  line-height: 1.45;
  padding: 0 0 max(28px, env(safe-area-inset-bottom));
}
button, [role="button"], .btn, .chip, .eitem, summary, select { touch-action: manipulation; }
.wrap {
  width: min(1240px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
  padding: 0 12px;
  min-width: 0;
}
.appbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: max(12px, env(safe-area-inset-top)) 2px 0;
}
.mark {
  width: 44px; height: 44px; flex: none;
  border-radius: 14px;
  display: grid; place-items: center;
  background: linear-gradient(165deg, #1a2748, #0b1224);
  border: 1px solid rgba(245, 184, 0, .45);
}
.brand { min-width: 0; }
.brand h1 {
  font-size: 15px;
  font-weight: 750;
  letter-spacing: .11em;
  line-height: 1.15;
}
.brand h1 span { color: var(--or); }
.brand small { display: block; margin-top: 3px; color: var(--mut); font-size: 12.5px; letter-spacing: .01em; }
.notice {
  grid-column: 1 / -1;
  background: #2a1a05;
  border: 1px solid #7a4a00;
  color: #ffd58a;
  border-radius: 14px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.45;
}
.notice[hidden] { display: none; }
.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 0;
  width: 100%;
}
.cv {
  position: relative;
  aspect-ratio: 9 / 16;
  height: var(--preview-h);
  width: auto;
  max-width: min(100%, 420px);
  border-radius: 22px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 22px 50px rgba(0, 0, 0, .38), 0 0 0 1px rgba(255, 255, 255, .14);
}
canvas#cv { width: 100%; height: 100%; display: block; touch-action: pan-y; }
canvas#cv.move { touch-action: none; cursor: move; outline: 2px dashed var(--or); outline-offset: -4px; }
.bigplay {
  position: absolute; inset: 0; width: 100%; border: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .28); cursor: pointer;
}
.bigplay[hidden] { display: none; }
.bigplay span {
  width: 68px; height: 68px; border-radius: 50%;
  background: rgba(255, 255, 255, .94);
  display: flex; align-items: center; justify-content: center;
}
.bigplay span::after {
  content: ""; margin-left: 6px;
  border-style: solid; border-width: 12px 0 12px 20px;
  border-color: transparent transparent transparent #0a1230;
}
.ctrl, .seekline, #tlbar { width: min(100%, 520px); max-width: 100%; }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.ctrl button, .btn, .tabs button, .chip {
  min-height: var(--tap);
  min-width: var(--tap);
}
.ctrl button {
  padding: 0 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: #fff;
  font: 650 13.5px var(--font);
  cursor: pointer;
}
.ctrl button.main {
  background: linear-gradient(180deg, #3d86ff, #1f55e6);
  border-color: transparent;
  padding: 0 16px;
  flex: 1 1 120px;
}
.ctrl button.iconly { flex: 0 0 var(--tap); padding: 0; font-size: 18px; }
.ctrl button.on { background: var(--or); color: #14110a; border-color: transparent; }
.seekline { display: flex; align-items: center; gap: 8px; }
.seekline input[type="range"] { flex: 1; min-width: 0; height: 28px; accent-color: var(--or); }
.time { font: 650 12px ui-monospace, Menlo, monospace; color: var(--mut); flex: none; }
#tlbar { display: flex; gap: 4px; height: 32px; }
#tlbar div {
  border-radius: 8px;
  background: #17224a;
  color: var(--mut);
  font: 700 11px var(--font);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; cursor: pointer;
  border: 1px solid transparent;
  white-space: nowrap;
  min-width: 0;
  padding: 0 4px;
}
#tlbar div.sel { background: #27408f; color: #fff; border-color: var(--or); }
.panel { min-width: 0; width: 100%; }
.tabs {
  display: flex; gap: 8px;
  overflow-x: auto; overscroll-behavior-x: contain;
  padding: 4px 0 10px;
  scrollbar-width: none;
  position: sticky; top: 0; z-index: 24;
  background: linear-gradient(#070b16 72%, rgba(7, 11, 22, 0));
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: 0 0 auto;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--mut);
  font: 700 13.5px var(--font);
  cursor: pointer;
}
.tabs button.on { background: #1d3a8a; color: #fff; border-color: #6b93ff; }
section.tab { display: none; min-width: 0; }
section.tab.on { display: grid; gap: 12px; }
.box {
  background: rgba(18, 26, 51, .94);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  display: grid;
  gap: 12px;
  min-width: 0;
}
.box h3 { font-size: 15px; font-weight: 750; letter-spacing: .01em; }
.hint { color: var(--mut); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.chips { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding-bottom: 2px; scrollbar-width: thin; }
.chip {
  flex: none;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card2);
  color: #d5def8;
  font: 700 13px var(--font);
  cursor: pointer;
  white-space: nowrap;
}
.chip.sel { background: #1d3a8a; border-color: #6b93ff; color: #fff; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  min-height: var(--tap);
  height: auto;
  padding: 8px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card2);
  color: #fff;
  font: 650 13.5px var(--font);
  cursor: pointer;
}
.btn.gold {
  background: linear-gradient(180deg, #ffe45c, #f5b800 55%, #c98a00);
  color: #14110a;
  border: 0;
  font-weight: 800;
}
.btn.red { border-color: #7a1d22; color: #ffb4b8; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: grid; gap: 6px; min-width: 0; }
.row > label {
  font-size: 12.5px; color: var(--mut); font-weight: 650;
  display: flex; justify-content: space-between; gap: 8px;
}
.row > label b { color: #fff; font-weight: 700; }
.row.chk label {
  flex-direction: row; justify-content: flex-start; align-items: center;
  gap: 10px; color: #e7edff; font-size: 14px; min-height: var(--tap);
}
.row.chk input { width: 22px; height: 22px; accent-color: var(--or); }
input[type="text"], input[type="number"], textarea, select {
  width: 100%; max-width: 100%;
  background: var(--card2); color: #fff;
  border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; font: 600 15px var(--font); min-height: var(--tap); min-width: 0;
}
textarea { min-height: 84px; resize: vertical; font-family: inherit; }
input[type="range"] { width: 100%; accent-color: var(--or); }
input[type="color"] { width: 100%; height: 44px; padding: 4px; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; }
input[type="file"] { font-size: 13px; color: var(--mut); max-width: 100%; min-height: var(--tap); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
details.grp { border: 1px solid var(--line); border-radius: 14px; background: var(--card2); min-width: 0; }
details.grp > summary {
  min-height: var(--tap);
  padding: 12px 14px;
  font-weight: 750;
  font-size: 14px;
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::after { content: "+"; color: var(--mut); font-weight: 500; }
details.grp[open] > summary::after { content: "–"; }
details.grp > .in { padding: 2px 12px 12px; display: grid; gap: 10px; }
.elist { display: grid; gap: 8px; }
.eitem {
  display: flex; gap: 10px; align-items: center;
  min-height: var(--tap);
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card2);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 650;
  min-width: 0;
}
.eitem.sel { border-color: #6b93ff; background: #142252; }
.eitem .mk { color: var(--or); flex: none; display: block; }
.eitem .en { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eitem span:last-child { color: var(--mut); font-weight: 550; font-size: 12px; margin-left: auto; white-space: nowrap; }
.tpl { display: grid; gap: 8px; }
.tpl button {
  text-align: left;
  min-height: var(--tap);
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card2);
  color: #fff;
  font: 650 14px var(--font);
  cursor: pointer;
}
.tpl button small { display: block; color: var(--mut); font-weight: 500; margin-top: 3px; font-size: 12.5px; }
#result video, #result img, #vresult video { width: min(100%, 280px); border-radius: 14px; display: block; margin: 0 auto; background: #000; }
#result, #vresult { display: grid; gap: 10px; }
#status { font-size: 13px; color: var(--mut); min-height: 18px; }
a.lnk { color: var(--or); font-weight: 750; }
.shapegrid, .filegrid, .vidgrid {
  display: grid;
  gap: 8px;
  min-width: 0;
}
.shapegrid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.filegrid { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); }
.vidgrid { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
.shapegrid button {
  min-height: 104px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #0a1020;
  color: #dfe6ff;
  font: 650 11.5px var(--font);
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 6px;
  padding: 8px 6px;
  cursor: pointer;
}
.shapegrid button img { width: 54px; height: 54px; object-fit: contain; }
.shapegrid button span, .cardname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.fcard, .vcard {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  display: grid;
  min-width: 0;
}
.fcard img, .fcard .ph, .vcard img, .vcard .ph {
  width: 100%;
  display: block;
  background: #070b16;
  object-fit: contain;
}
.fcard img, .fcard .ph { aspect-ratio: 1; }
.vcard img, .vcard .ph { aspect-ratio: 9 / 14; object-fit: cover; }
.ph { display: grid; place-items: center; color: var(--mut); font-size: 12px; font-weight: 700; }
.meta { padding: 8px; display: grid; gap: 6px; min-width: 0; }
.meta b, .cardname { font-size: 13px; }
.meta small { color: var(--mut); font-size: 12px; }
.vacts { display: grid; gap: 6px; }
.layer {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: center;
  padding: 8px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card2);
}
.layer .ops { display: flex; gap: 6px; }
.fxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.fxgrid button, .angrid button {
  min-height: 72px;
  text-align: left;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card2);
  color: #fff;
  padding: 10px 12px;
  cursor: pointer;
  font: 700 13.5px var(--font);
}
.fxgrid button small, .angrid button small { display: block; color: var(--mut); font-weight: 550; margin-top: 4px; font-size: 12px; }
.angrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
body.flyer-on .seekline,
body.flyer-on #tlbar,
body.flyer-on #bSound,
body.flyer-on #bRestart,
body.flyer-on #bUndo,
body.flyer-on #bRedo,
body.flyer-on #bMove,
body.flyer-on .bigplay { display: none !important; }
body.flyer-on #bPlay { min-width: 88px; }
@media (min-width: 900px) {
  :root { --preview-h: min(78vh, 760px); }
  .wrap {
    grid-template-columns: minmax(280px, 400px) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
    padding: 8px 20px 32px;
  }
  .stage { position: sticky; top: 12px; }
  .panel { max-height: calc(100vh - 28px); overflow: auto; padding-right: 2px; }
  .tabs { top: 0; }
}
@media (max-width: 899px) {
  .ctrl button:not(.iconly):not(.main) { flex: 1 1 auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar">
    <div class="mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="7" y="2.5" width="10" height="19" rx="2.2" stroke="#f5b800" stroke-width="1.6"></rect>
        <path d="M10 7.2h4.4v6.4L10 16.4V7.2z" fill="#2a6bff"></path>
        <circle cx="16.4" cy="6" r="1.6" fill="#e8202c"></circle>
      </svg>
    </div>
    <div class="brand">
      <h1>STUDIO <span>VIDÉO PRO</span></h1>
      <small>Vidéos promo, flyers, commerces et certifications</small>
    </div>
  </header>
  <div class="notice" id="frameNotice" hidden>Cette page est affichée dans un cadre (aperçu intégré). Les téléchargements y sont souvent bloqués : ouvre-la dans ton navigateur (Chrome ou Safari), ou depuis ton lien GitHub Pages, pour pouvoir enregistrer les vidéos.</div>

  <div class="stage">
    <div class="cv">
      <canvas id="cv"></canvas>
      <button class="bigplay" id="bigplay" aria-label="Lecture"><span></span></button>
    </div>
    <div class="ctrl">
      <button class="main" id="bPlay" type="button">Lecture</button>
      <button class="iconly" id="bRestart" type="button" aria-label="Recommencer">↺</button>
      <button class="iconly" id="bUndo" type="button" aria-label="Annuler">↶</button>
      <button class="iconly" id="bRedo" type="button" aria-label="Rétablir">↷</button>
      <button class="iconly" id="bMove" type="button" title="Déplacer l’élément choisi en glissant sur l’aperçu" aria-label="Déplacer">✥</button>
      <button id="bSound" type="button">Son</button>
    </div>
    <div class="seekline">
      <input type="range" id="seek" min="0" max="30" step="0.01" value="0" aria-label="Position">
      <span class="time" id="time">0:00 / 0:30</span>
    </div>
    <div id="tlbar"></div>
  </div>

  <div class="panel">
    <div class="tabs" id="tabs" role="tablist">
      <button data-tab="scene" class="on" type="button">Scènes</button>
      <button data-tab="els" type="button">Éléments</button>
      <button data-tab="flyers" type="button">Flyers</button>
      <button data-tab="calques" type="button">Calques</button>
      <button data-tab="fx" type="button">Effets</button>
      <button data-tab="anim" type="button">Animations</button>
      <button data-tab="files" type="button">Fichiers</button>
      <button data-tab="videos" type="button">Mes vidéos</button>
      <button data-tab="ident" type="button">Identité</button>
      <button data-tab="son" type="button">Son</button>
      <button data-tab="projet" type="button">Projet</button>
    </div>

    <section class="tab on" id="tab-scene"></section>
    <section class="tab" id="tab-els"></section>
    <section class="tab" id="tab-flyers"></section>
    <section class="tab" id="tab-calques"></section>
    <section class="tab" id="tab-fx"></section>
    <section class="tab" id="tab-anim"></section>
    <section class="tab" id="tab-files"></section>
    <section class="tab" id="tab-videos"></section>
    <section class="tab" id="tab-ident"></section>
    <section class="tab" id="tab-son"></section>
    <section class="tab" id="tab-projet"></section>
  </div>
</div>

<script>
/* =====================================================================
   STUDIO VIDÉO PUB – PLUG 2 FRANCE
   Un seul fichier. Tout est modifiable depuis l’interface :
   scènes, éléments (bandeaux, textes, images, téléphones, badges), son, export.
   ===================================================================== */
'use strict';
const DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eoExpo = p => { p = clamp(p); return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); };
const eoBack = (p, s = 1.70158) => { p = clamp(p); const q = p - 1; return 1 + (s + 1) * q * q * q + s * q * q; };
const eio = p => { p = clamp(p); return 3 * p * p - 2 * p * p * p; };
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w) || 1); c.height = Math.max(1, Math.round(h) || 1); return c; };
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function dropCanvas(c) {
  if (!c || typeof c.getContext !== 'function') return;
  try { c.width = 1; c.height = 1; } catch (e) {}
  if (c.parentNode) c.parentNode.removeChild(c);
}
function ctx2d(c) {
  if (!c) return null;
  let x = null;
  try { x = c.getContext('2d'); } catch (e) { x = null; }
  if (x) return x;
  // Safari iOS renvoie null si le canvas n'est pas dans la page, ou si le GPU n'a plus de mémoire.
  try {
    if (document.body && !c.isConnected) {
      c.setAttribute('aria-hidden', 'true');
      c.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
      document.body.appendChild(c);
      x = c.getContext('2d');
    }
  } catch (e) {}
  return x || null;
}
function drawVignette(ctx, amount) {
  const a = amount == null ? .62 : +amount;
  if (!(a > .01) || !ctx || !ctx.canvas) return;
  const w = ctx.canvas.width, h = ctx.canvas.height;
  if (!(w > 0 && h > 0)) return;
  const inner = h * .18, outer = Math.max(inner + 1, h * .62);
  const vg = ctx.createRadialGradient(w / 2, h / 2, inner, w / 2, h / 2, outer);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,' + Math.min(.85, a) + ')');
  ctx.save();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h); ctx.restore();
}
function allocScene() {
  dropCanvas(sc);
  main.width = RES; main.height = Math.round(RES * 16 / 9);
  sc = cv(main.width, main.height);
  g = ctx2d(sc);
  if (!g && RES > 360) {
    RES = Math.max(360, Math.round(RES * .72));
    K = RES / W; BS = K * 1.3;
    dropCanvas(sc);
    main.width = RES; main.height = Math.round(RES * 16 / 9);
    sc = cv(main.width, main.height);
    g = ctx2d(sc);
  }
  return g;
}
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function softBlur(src, shrink, passes = 2) {
  let cur = src;
  for (let i = 0; i < passes; i++) {
    const s = cv(Math.max(4, cur.width / shrink), Math.max(4, cur.height / shrink)), x = ctx2d(s);
    if (!x) return cur;
    x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, s.width, s.height);
    const b = cv(Math.max(1, src.width), Math.max(1, src.height)), y = ctx2d(b);
    if (!y) { dropCanvas(s); return cur; }
    y.imageSmoothingQuality = 'high'; y.drawImage(s, 0, 0, b.width, b.height);
    dropCanvas(s);
    if (cur !== src) dropCanvas(cur);
    cur = b;
  }

/* ---- remise du fichier à l’utilisateur (plusieurs solutions de secours) ---- */
function deliver(blob, filename, kind) {
  const url = URL.createObjectURL(blob), box = $('result') || (() => { const d = mk('div'); d.id = 'result'; document.body.append(d); return d; })();
  box.innerHTML = '';
  if (!blob.size) { box.append(mk('div', 'hint', '⚠ Le fichier est vide : l’enregistrement a échoué sur ce navigateur. Essaie Chrome (ordinateur) ou Safari récent.')); return; }
  if (kind === 'video') { const v = mk('video'); v.src = url; v.controls = true; v.playsInline = true; v.preload = 'metadata'; box.append(v); }
  else if (kind === 'image') { const im = mk('img'); im.src = url; box.append(im); }
  const mb = (blob.size / 1048576).toFixed(1);
  box.append(mk('div', 'hint', `Fichier prêt : <b>${filename}</b> (${mb} Mo).`));
  const btns = mk('div', 'btns');
  const save = mk('button', 'btn gold', 'Enregistrer'); save.type = 'button';
  save.onclick = async () => {
    try { const f = new File([blob], filename, { type: blob.type }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  };
  btns.append(save);
  const open = mk('a', 'btn', 'Ouvrir dans un onglet'); open.href = url; open.target = '_blank'; open.rel = 'noopener'; open.style.cssText = 'display:inline-flex;align-items:center;text-decoration:none'; btns.append(open);
  box.append(btns);
  const dl = mk('a', 'lnk', 'Lien de secours : télécharger ' + filename); dl.href = url; dl.download = filename; box.append(dl);
  let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  box.append(mk('div', 'hint', inFrame ? '⚠ Tu es dans un aperçu intégré : les téléchargements y sont bloqués. Ouvre cette page dans Chrome ou Safari (ou depuis ton lien GitHub Pages), puis recommence.' :
    'Si « Enregistrer » ne fait rien : ouvre le fichier dans un onglet, puis utilise le menu du lecteur (⋮ → Télécharger) ou un appui long. Sur iPhone, « Enregistrer » ouvre la feuille de partage : choisis « Enregistrer la vidéo » ou « Enregistrer dans Fichiers ».'));
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function drawShapeEl(e, p) {

function handFile(blob, filename) {
  const url = URL.createObjectURL(blob);
  const go = () => {
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  };
  if (navigator.canShare) {
    const f = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f], title: filename }).catch(err => { if (!err || err.name !== 'AbortError') go(); });
      return;
    }
  }
  go();
}

async function keepVideo(rec) {

  writeVidIndex(vidIndex().filter(v => v.id !== rec.id).concat([meta]));

async function loadVideos() {
  const byId = new Map();
  try { (await idbAll('videos')).forEach(r => { if (r && r.id) byId.set(r.id, r); }); } catch (e) {}
  for (const m of vidIndex()) {
    const prev = byId.get(m.id) || {};
    let blob = prev.blob && prev.blob.size ? prev.blob : null;
    if (!blob) { try { blob = await opfsGet('vid_' + m.id); } catch (e) {} }
    byId.set(m.id, Object.assign({}, prev, m, { blob: blob || null, thumb: (m.thumb || prev.thumb || '') }));
