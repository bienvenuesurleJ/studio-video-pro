<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Studio Vidéo Pro</title>
<style>
:root {
  --bg: #070b16;
  --card: #0f1730;
  --card2: #0a1022;
  --line: rgba(255,255,255,.12);
  --txt: #fff;
  --mut: #9aa6c8;
  --accent: #2a6bff;
  --gold: #f5b800;
  --danger: #e8202c;
  --preview-h: 48vh;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: radial-gradient(120% 60% at 50% 0%, #0e1a3d 0%, var(--bg) 60%) fixed; color: var(--txt); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; min-height: 100vh; }
header { padding: max(8px, env(safe-area-inset-top)) 12px 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; font-weight: 800; }
header small { color: var(--mut); font-size: 11px; }
.layout { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(300px, 380px) 1fr; }
  .preview-col { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  :root { --preview-h: min(70vh, 820px); }
}
.preview-col { background: var(--bg); padding: 8px 8px 4px; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
.cv-wrap { position: relative; aspect-ratio: 9/16; height: var(--preview-h); max-width: 100%; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 12px 30px rgba(0,0,0,.5); }
canvas#cv { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.handles { position: absolute; inset: 0; pointer-events: none; }
.handle { position: absolute; width: 16px; height: 16px; background: var(--gold); border: 2px solid #000; border-radius: 50%; pointer-events: auto; }
.ctrl { display: flex; align-items: center; gap: 6px; width: 100%; max-width: 480px; margin: 8px auto 4px; padding: 0 4px; }
.ctrl button, .btn { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: #fff; font: 600 14px system-ui; cursor: pointer; }
.btn.gold { background: linear-gradient(180deg, #ffe45c, #f5b800); color: #111; border: 0; font-weight: 800; }
.btn.red { color: #ff9aa0; border-color: #7a1d22; }
.time { font: 600 12px ui-monospace, Menlo, monospace; color: var(--mut); white-space: nowrap; }
.panel { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 10px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px 0 8px; position: sticky; top: 0; background: var(--bg); z-index: 20; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--mut); font: 700 13px system-ui; cursor: pointer; }
.tabs button.on { background: #1d3a8a; color: #fff; border-color: #4f7dff; }
.tab { display: none; }
.tab.on { display: block; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.box h3 { font-size: 15px; }
.hint { color: var(--mut); font-size: 13px; line-height: 1.4; }
.chips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.chip { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: #cfd8f5; font: 700 13px system-ui; cursor: pointer; white-space: nowrap; }
.chip.sel { background: #1d3a8a; border-color: #4f7dff; color: #fff; }
input, select, textarea { width: 100%; background: var(--card2); color: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 600 16px system-ui; }
input[type=range] { padding: 0; height: 28px; accent-color: var(--gold); }
.row { display: grid; gap: 6px; }
.row label { font-size: 13px; color: var(--mut); font-weight: 600; display: flex; justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
#status { font-size: 13px; color: var(--mut); min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>STUDIO VIDÉO PRO</h1>
  <small>version mobile optimisée</small>
</header>
<div class="layout">
  <div class="preview-col">
    <div class="stage">
      <div class="cv-wrap">
        <canvas id="cv"></canvas>
        <div class="handles" id="handles"></div>
      </div>
    </div>
    <div class="ctrl">
      <button id="bPlay" class="btn gold">Lecture</button>
      <button id="bRestart">↺</button>
      <input type="range" id="seek" min="0" max="30" step="0.01" value="0">
      <span class="time" id="time">0:00 / 0:30</span>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="tabs" id="tabs">
      <button data-tab="scene" class="on">Scènes</button>
      <button data-tab="elements">Éléments</button>
      <button data-tab="photos">Photos</button>
      <button data-tab="audio">Audio</button>
      <button data-tab="layers">Calques</button>
      <button data-tab="palettes">Palettes</button>
      <button data-tab="anim">Animations</button>
      <button data-tab="project">Projet</button>
    </div>
    <div class="tab on" id="tab-scene"><div class="box"><h3>Scènes</h3><p class="hint">Studio vidéo optimisé mobile.</p><div id="sceneList"></div><button class="btn gold" id="addScene">+ Scène</button></div></div>
    <div class="tab" id="tab-elements"><div class="box"><h3>Bibliothèque d'éléments</h3><div class="chips" id="elemCats"></div><div id="elemLib"></div></div></div>
    <div class="tab" id="tab-photos"><div class="box"><h3>Photos / Insertions visuelles</h3><button class="btn gold" id="addPhoto">Ajouter une photo</button><input type="file" id="photoFile" accept="image/*" hidden><div id="photoList"></div></div></div>
    <div class="tab" id="tab-audio"><div class="box"><h3>Audio & Musique</h3><input type="file" id="audioFile" accept="audio/*" multiple><div id="audioTracks"></div></div></div>
    <div class="tab" id="tab-layers"><div class="box"><h3>Calques</h3><div id="layerList"></div></div></div>
    <div class="tab" id="tab-palettes"><div class="box"><h3>Palettes</h3><div id="paletteUI"></div></div></div>
    <div class="tab" id="tab-anim"><div class="box"><h3>Animations & Transitions</h3></div></div>
    <div class="tab" id="tab-project"><div class="box"><h3>Projet & Export</h3><button class="btn gold" id="exportVid">Exporter la vidéo</button><div id="status"></div><div id="result"></div></div></div>
  </div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('cv'), ctx = canvas.getContext('2d');
const W = 1080, H = 1920;
let scale = 1;
function resize() {
  const wrap = canvas.parentElement;
  const r = wrap.getBoundingClientRect();
  canvas.width = Math.max(1, r.width);
  canvas.height = Math.max(1, r.height);
  scale = canvas.width / W;
}
window.addEventListener('resize', resize);
setTimeout(resize, 100);
let project = { scenes: [{ id: 's1', name: 'Scène 1', dur: 5, elements: [], photos: [] }], audio: [], currentTime: 0, duration: 5 };
function render() {
  ctx.fillStyle = '#070b16';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(scale, scale);
  ctx.fillStyle = '#0e1a3d';
  ctx.fillRect(0, 0, W, H);
  const t = project.currentTime;
  project.scenes.forEach(s => {
    (s.photos || []).forEach(p => {
      if (t >= p.t0 && t <= (p.t1 || 999) && p.img) {
        ctx.globalAlpha = p.opacity || 1;
        ctx.drawImage(p.img, p.x || 200, p.y || 400, p.w || 600, p.h || 600);
        ctx.globalAlpha = 1;
      }
    });
  });
  ctx.restore();
  requestAnimationFrame(render);
}
render();
document.querySelectorAll('#tabs button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    b.classList.add('on');
    $('tab-' + b.dataset.tab).classList.add('on');
  };
});
$('addPhoto').onclick = () => $('photoFile').click();
$('photoFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.src = URL.createObjectURL(f);
  await new Promise(r => img.onload = r);
  const photo = { id: 'p' + Date.now(), img, t0: project.currentTime, t1: project.currentTime + 4, x: 200, y: 400, w: 600, h: 600, opacity: 1 };
  project.scenes[0].photos.push(photo);
  updatePhotoList();
};
function updatePhotoList() {
  const list = $('photoList'); list.innerHTML = '';
  (project.scenes[0].photos || []).forEach(p => {
    const d = document.createElement('div'); d.className = 'hint';
    d.textContent = `Photo : ${p.t0.toFixed(1)}s → ${p.t1.toFixed(1)}s`;
    list.appendChild(d);
  });
}
let playing = false;
$('bPlay').onclick = () => {
  playing = !playing;
  $('bPlay').textContent = playing ? 'Pause' : 'Lecture';
  if (playing) loop();
};
function loop() {
  if (!playing) return;
  project.currentTime += 0.033;
  if (project.currentTime > project.duration) project.currentTime = 0;
  $('seek').value = project.currentTime;
  $('time').textContent = formatTime(project.currentTime) + ' / ' + formatTime(project.duration);
  requestAnimationFrame(loop);
}
$('seek').oninput = e => { project.currentTime = +e.target.value; };
function formatTime(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return m + ':' + String(sec).padStart(2,'0'); }
$('exportVid').onclick = async () => {
  const status = $('status');
  status.textContent = 'Export en cours...';
  const stream = canvas.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: mime });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'studio-video.webm'; a.click();
    status.textContent = 'Export terminé !';
    $('result').innerHTML = `<video src="${url}" controls style="width:100%;max-width:280px;border-radius:12px;margin:8px auto;display:block"></video>`;
  };
  rec.start();
  project.currentTime = 0; playing = true;
  setTimeout(() => { rec.stop(); playing = false; }, project.duration * 1000 + 200);
};
const categories = ['Luxe', 'Commerce', 'Certification', 'Technologie', 'Promotion', 'Formes', 'Effets'];
categories.forEach(cat => {
  const chip = document.createElement('button'); chip.className = 'chip'; chip.textContent = cat;
  $('elemCats').appendChild(chip);
});
$('audioFile').onchange = async e => {
  for (const f of e.target.files) {
    project.audio.push({ name: f.name, vol: 1 });
  }
  updateAudioList();
};
function updateAudioList() {
  const d = $('audioTracks'); d.innerHTML = '';
  project.audio.forEach(a => {
    const el = document.createElement('div'); el.className = 'hint'; el.textContent = a.name;
    d.appendChild(el);
  });
}
const presets = { 'Noir et or': { bg: '#070b16', accent: '#f5b800' }, 'Luxe violet': { bg: '#1a0a2e', accent: '#b388ff' } };
Object.entries(presets).forEach(([name, p]) => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = name;
  b.onclick = () => { document.documentElement.style.setProperty('--bg', p.bg); document.documentElement.style.setProperty('--accent', p.accent); };
  $('paletteUI').appendChild(b);
});
$('time').textContent = '0:00 / ' + formatTime(project.duration);
$('seek').max = project.duration;
console.log('Studio vidéo optimisé mobile');
</script>
</body>
</html>
