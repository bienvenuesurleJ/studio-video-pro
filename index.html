/* ---- remise du fichier à l’utilisateur (plusieurs solutions de secours) ---- */
function deliver(blob, filename, kind) {
  const url = URL.createObjectURL(blob), box = $('result') || (() => { const d = mk('div'); d.id = 'result'; document.body.append(d); return d; })();
  box.innerHTML = '';

  if (kind === 'video') { const v = mk('video'); v.src = url; v.controls = true; v.playsInline = true; v.preload = 'metadata'; box.append(v); }
  else if (kind === 'image') { const im = mk('img'); im.src = url; box.append(im); }
  const mb = (blob.size / 1048576).toFixed(1);
  box.append(mk('div', 'hint', `Fichier prêt : <b>${filename}</b> (${mb} Mo).`));
  const btns = mk('div', 'btns');
  const save = mk('button', 'btn gold', 'Enregistrer'); save.type = 'button';
  save.onclick = async () => {
    try { const f = new File([blob], filename, { type: blob.type }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  };
  btns.append(save);
  const open = mk('a', 'btn', 'Ouvrir dans un onglet'); open.href = url; open.target = '_blank'; open.rel = 'noopener'; open.style.cssText = 'display:inline-flex;align-items:center;text-decoration:none'; btns.append(open);
  box.append(btns);
  const dl = mk('a', 'lnk', 'Lien de secours : télécharger ' + filename); dl.href = url; dl.download = filename; box.append(dl);
  let inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
  box.append(mk('div', 'hint', inFrame ? '⚠ Tu es dans un aperçu intégré : les téléchargements y sont bloqués. Ouvre cette page dans Chrome ou Safari (ou depuis ton lien GitHub Pages), puis recommence.' :
    'Si « Enregistrer » ne fait rien : ouvre le fichier dans un onglet, puis utilise le menu du lecteur (⋮ → Télécharger) ou un appui long. Sur iPhone, « Enregistrer » ouvre la feuille de partage : choisis « Enregistrer la vidéo » ou « Enregistrer dans Fichiers ».'));
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
